<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archives Hatori — Hoboro</title>
<style>
:root{
  --bg:#0a0f0c; --bg2:#0e1512; --panel:#111a15; --paper:#161f19;
  --green:#3ddc6b; --green-dim:#1f7a42; --purple:#8a5cf6; --purple-dim:#4a2f8c;
  --gold:#d4af6a; --text:#dce8de; --text-dim:#8aa093; --border:#22332a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:'Georgia','Yu Mincho',serif; background:var(--bg); color:var(--text); min-height:100%;
  background-image:radial-gradient(circle at 20% 20%, rgba(61,220,107,.05), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(138,92,246,.07), transparent 45%);
}
h1,h2,h3{font-family:'Yu Mincho','Georgia',serif;letter-spacing:.03em}
::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:var(--green-dim);border-radius:4px}

#fireflies{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px 3px rgba(61,220,107,.8); animation:drift linear infinite, glow 3s ease-in-out infinite}
.firefly.p{background:var(--purple);box-shadow:0 0 8px 3px rgba(138,92,246,.8)}
@keyframes drift{0%{transform:translate(0,0)}25%{transform:translate(30px,-40px)}50%{transform:translate(-20px,-80px)}75%{transform:translate(20px,-40px)}100%{transform:translate(0,0)}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:1}}

.app{position:relative;z-index:2;display:flex;min-height:100vh}
#sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--panel),var(--bg2));
  border-right:1px solid var(--border);padding:18px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand b{color:var(--green);font-size:1.1em}
.brand span{display:block;color:var(--text-dim);font-size:.75em;margin-top:2px}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;
  color:var(--text-dim);font-size:.92em;margin-bottom:2px;transition:.2s}
.navitem:hover{background:rgba(61,220,107,.08);color:var(--text)}
.navitem.active{background:rgba(61,220,107,.14);color:var(--green);box-shadow:inset 0 0 12px rgba(61,220,107,.15)}
.navitem.secret{color:#b48ce8}
.navitem.secret.active{background:rgba(138,92,246,.15);color:var(--purple)}
.navcount{margin-left:auto;font-size:.72em;color:var(--text-dim);opacity:.7}

#main{flex:1;padding:26px 30px;max-width:100%;overflow-x:hidden}
.topbar{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
#search{flex:1;min-width:180px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--paper);color:var(--text);font-family:inherit}
.btn{background:linear-gradient(135deg,var(--green-dim),var(--green));color:#04150a;border:none;
  padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-family:inherit;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim)}
.btn.purple{background:linear-gradient(135deg,var(--purple-dim),var(--purple));color:#fff}
.btn.danger{background:transparent;border:1px solid #7a3030;color:#e08a8a}

.hero{text-align:center;padding:30px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:24px}
.hero .sigil{font-size:2.6em;filter:drop-shadow(0 0 12px rgba(61,220,107,.6))}
.hero h1{font-size:1.9em;color:var(--green);margin:8px 0 6px}
.hero .quote{color:var(--text-dim);font-style:italic;max-width:520px;margin:0 auto 8px;line-height:1.6}
.hero .sub{letter-spacing:.2em;font-size:.75em;color:var(--gold)}

.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0}
.counter{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;
  animation:fadein .5s ease both;cursor:default;transition:.2s}
.counter:hover{box-shadow:0 0 14px rgba(61,220,107,.15)}
.counter .n{font-size:1.6em;color:var(--green);font-weight:700}
.counter .l{font-size:.75em;color:var(--text-dim)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.section-title h2{color:var(--green);margin:0;font-size:1.3em}
.section-title p{color:var(--text-dim);font-size:.82em;margin:2px 0 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters select{background:var(--paper);color:var(--text-dim);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-family:inherit}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;
  transition:.2s;position:relative;animation:fadein .4s ease both}
.card:hover{border-color:var(--green-dim);box-shadow:0 0 18px rgba(61,220,107,.15);transform:translateY(-2px)}
.card .star{position:absolute;top:10px;right:10px;cursor:pointer;color:#555;font-size:1.1em;z-index:2}
.card .star.on{color:var(--gold);text-shadow:0 0 8px rgba(212,175,106,.7)}
.card h3{margin:0 24px 4px 0;font-size:1.05em;color:var(--text)}
.card .meta{font-size:.78em;color:var(--text-dim);margin-bottom:6px}
.badge{display:inline-block;font-size:.68em;padding:2px 8px;border-radius:10px;background:rgba(61,220,107,.12);color:var(--green);margin:0 4px 4px 0}
.badge.purple{background:rgba(138,92,246,.15);color:var(--purple)}
.badge.gold{background:rgba(212,175,106,.15);color:var(--gold)}
.progress-bar{height:6px;border-radius:3px;background:#1a241d;margin-top:8px;overflow:hidden}
.progress-bar div{height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green))}
.card .desc{font-size:.82em;color:var(--text-dim);margin-top:6px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--text-dim);font-style:italic;padding:34px;text-align:center;border:1px dashed var(--border);border-radius:10px;grid-column:1/-1}

.secretview{background:radial-gradient(circle at 50% 0%, rgba(74,47,140,.25), var(--bg));
  border:1px solid var(--purple-dim);border-radius:12px;padding:24px}
.secretview h2{color:var(--purple)}
.lockscreen{text-align:center;padding:40px 10px;color:var(--text-dim)}
.lockscreen .icon{font-size:2.4em;color:var(--purple)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto}
.modal h3{color:var(--green);margin-top:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:.78em;color:var(--text-dim);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--paper);color:var(--text);font-family:inherit}
.field textarea{min-height:56px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.linkrow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--paper);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;margin-bottom:6px;font-size:.88em}
.linkrow:hover{border-color:var(--green-dim)}
.kv{display:flex;gap:6px;font-size:.85em;margin:4px 0}
.kv b{color:var(--text-dim);min-width:150px;flex-shrink:0}

#constellation{position:relative;height:260px;background:radial-gradient(circle at 50% 50%, rgba(61,220,107,.06), transparent 70%);
  border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden}
.star-point{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--green);cursor:pointer;
  box-shadow:0 0 10px 4px rgba(61,220,107,.6);animation:glow 2.4s ease-in-out infinite}
.star-point:hover{transform:scale(1.6)}

#mobiletoggle{display:none}
@media (max-width:820px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:.25s;width:220px}
  #sidebar.open{transform:translateX(0)}
  #mobiletoggle{display:inline-block}
  #main{padding:18px 14px}
  .app{display:block}
  .kv{flex-direction:column}
  .kv b{min-width:0}
}
</style>
</head>
<body>
<div id="fireflies"></div>
<div class="app">
  <div id="sidebar">
    <div class="brand"><b>🕯️ HATORI</b><span>Carnet de Hoboro</span></div>
    <div id="nav"></div>
  </div>
  <div id="main">
    <div class="topbar">
      <button class="btn ghost" id="mobiletoggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <input id="search" placeholder="🔍 Rechercher dans les archives...">
      <button class="btn" onclick="openAdd()">＋ Nouvelle entrée</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

<script>
const CATS = [
 {k:'herbier',i:'🌿',n:'Herbier',extra:[
   {k:'nomSci',l:'Nom scientifique fictif'},{k:'saison',l:'Saison'},
   {k:'apparence',l:'Apparence',ta:1},{k:'proprietes',l:'Propriétés RP',ta:1},{k:'utilisation',l:'Utilisation',ta:1}]},
 {k:'poisons',i:'☠️',n:'Poisons',extra:[
   {k:'symbole',l:'Symbole (emoji)'},{k:'origine',l:'Origine'},{k:'aspect',l:'Aspect'},{k:'odeur',l:'Odeur'},{k:'couleur',l:'Couleur'},
   {k:'duree',l:'Durée RP'},{k:'danger',l:'Niveau de danger',sel:['Faible','Moyen','Élevé','Critique']},
   {k:'symptomes',l:'Symptômes narratifs',ta:1},{k:'contremesures',l:'Contre-mesures générales',ta:1}]},
 {k:'antidotes',i:'🩹',n:'Antidotes',extra:[
   {k:'origine',l:'Origine'},{k:'apparence',l:'Apparence'},{k:'poisonAssocie',l:'Poison associé',link:'poisons'},
   {k:'tempsAction',l:"Temps d'action narratif"},{k:'ingredients',l:'Ingrédients fictifs',ta:1},
   {k:'niveauMaitrise',l:'Niveau de maîtrise',sel:['Débutant','Intermédiaire','Avancé','Maîtrisé']}]},
 {k:'alchimie',i:'🧪',n:'Alchimie',extra:[
   {k:'objectif',l:'Objectif',ta:1},{k:'composants',l:'Composants fictifs',ta:1},{k:'resultat',l:'Résultat',ta:1},
   {k:'etat',l:'État',sel:['En attente','En cours','Réussi','Échec','Abandonné']}]},
 {k:'insectes',i:'🦋',n:'Insectes',extra:[
   {k:'type',l:'Type',sel:['Papillon','Abeille','Araignée','Coléoptère','Nocturne','Luciole']},
   {k:'taille',l:'Taille'},{k:'habitat',l:'Habitat'},{k:'comportement',l:'Comportement',ta:1},{k:'particularites',l:'Particularités',ta:1}]},
 {k:'lucioles',i:'✨',n:'Lucioles',extra:[
   {k:'couleurLumiere',l:'Couleur de lumière'},{k:'intensite',l:'Intensité',sel:['Faible','Moyenne','Forte']},
   {k:'cycle',l:'Cycle nocturne'},{k:'symbolique',l:'Symbolique',ta:1}]},
 {k:'nocturnes',i:'🌙',n:'Plantes nocturnes',extra:[
   {k:'heureOuverture',l:"Heure d'ouverture"},{k:'couleur',l:'Couleur'},{k:'luminosite',l:'Luminosité'}]},
 {k:'recherches',i:'🧬',n:'Recherches',extra:[
   {k:'categorieR',l:'Catégorie'},{k:'priorite',l:'Priorité',sel:['🔴 À commencer','🟡 En cours','🟢 Terminée','🟣 À approfondir']}]},
 {k:'experiences',i:'📜',n:'Expériences',extra:[
   {k:'numero',l:"Numéro d'expérience"},{k:'lieuExp',l:'Lieu'},{k:'hypothese',l:'Hypothèse',ta:1},
   {k:'resultatExp',l:'Résultat',ta:1},{k:'conclusion',l:'Conclusion',ta:1}]},
 {k:'notes',i:'📖',n:'Notes personnelles',extra:[]},
];
const catByKey = k=>CATS.find(c=>c.k===k);
const STORE_KEY='hatori-archives-v2';
let state = load();
let current = 'accueil';
let unlocked = false;
let statusFilter='';

function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }
  catch(e){ console.warn('storage read failed',e); }
  return {entries: seed()};
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ console.warn('storage write failed',e); } }
function uid(){ return 'e'+Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function seed(){
  const d=(n)=>({id:uid(),favorite:false,secret:false,extra:{},progress:0,rarity:'',location:'',date:'—',description:'',notes:'',status:'',...n});
  return [
   d({category:'herbier',name:'Fleur Hoshizora',rarity:'Rare',location:'Falaises du Nord',status:'Maîtrisée',progress:100,
     description:"Fleur violette qui ne s'ouvre qu'au clair de lune, à l'odeur douce-amère.",notes:'Composant principal de mes antidotes à base de rosée nocturne.',
     extra:{nomSci:'Stellafolia nocturna',saison:'Automne',apparence:'Pétales violets fins, cœur doré',proprietes:'Apaise légèrement les effets de certains poisons',utilisation:'Base de rosée pour antidotes'}}),
   d({category:'herbier',name:'Racine de Kagemori',rarity:'Peu commune',location:'Sous-bois Hatori',status:'Étudiée',progress:65,
     description:'Racine noire qui pousse à l\'ombre des grands arbres, très amère.',notes:'',
     extra:{nomSci:'Umbraradix nigra',saison:'Toute l\'année',apparence:'Racine tordue, noire',proprietes:'Neutralise partiellement certaines toxines',utilisation:'En cours d\'expérimentation'}}),
   d({category:'poisons',name:'Venin de Kurohana',rarity:'Peu commun',location:"Marais de l'Ouest",status:'En cours',progress:60,
     description:"Provoque un engourdissement progressif et des visions troubles chez la cible (effet RP).",notes:"Le clan interdit son usage hors cadre encadré.",
     extra:{symbole:'☠️',origine:'Fleur noire des marais',aspect:'Liquide sombre et visqueux',odeur:'Douceâtre',couleur:'Noir violacé',duree:'Quelques heures (RP)',danger:'Élevé',symptomes:'Engourdissement, vertiges, hallucinations légères',contremesures:'Repos et chaleur ; antidote recommandé'}}),
   d({category:'poisons',name:'Poison sans nom',location:'—',status:'À approfondir',progress:10,
     description:"Un poison qui ne toucherait jamais un membre du clan Hatori — projet encore secret.",notes:"À ne montrer à personne pour l'instant.",secret:true,
     extra:{symbole:'🕸️',danger:'Critique'}}),
   d({category:'antidotes',name:'Élixir de Luciole',rarity:'Rare',location:'Laboratoire Hatori',status:'Étudiée',progress:80,
     description:"Mélange de rosée de Hoshizora et de poudre de luciole séchée.",notes:"Redonne de la clarté d'esprit, effet RP progressif.",
     extra:{origine:'Recette personnelle de Hoboro',apparence:'Liquide vert pâle luminescent',tempsAction:'Quelques minutes (RP)',ingredients:'Rosée de Hoshizora, poudre de luciole',niveauMaitrise:'Avancé'}}),
   d({category:'alchimie',name:'Préparation n°14',status:'En cours',progress:45,location:'Laboratoire',
     description:'',notes:'Résultat instable pour l\'instant.',
     extra:{objectif:'Stabiliser un antidote à large spectre',composants:'Rosée de Hoshizora, extrait de Fleur de Minuit',resultat:'Encore instable',etat:'En cours'}}),
   d({category:'insectes',name:'Papillon de Cendre',rarity:'Peu commun',location:'Lisière Nord',status:'Découverte',progress:30,
     description:'Attiré par la lumière des lucioles, comportement encore mal compris.',notes:'',
     extra:{type:'Papillon',taille:'Moyenne',habitat:'Forêts sombres',comportement:'Nocturne, attiré par la lumière',particularites:'Ailes cendrées presque invisibles la nuit'}}),
   d({category:'lucioles',name:'Luciole Émeraude',rarity:'Commune',location:'Forêt Hatori',status:'Étudiée',progress:70,
     description:'Symbole discret du clan, apparaît surtout à la saison humide.',notes:'Je les observe souvent le soir après l\'hôpital.',
     extra:{couleurLumiere:'Vert émeraude',intensite:'Moyenne',cycle:'Active de minuit à l\'aube',symbolique:'Associée à la mémoire du clan'}}),
   d({category:'lucioles',name:'Luciole Améthyste',rarity:'Rare',location:'Grotte du clan',status:'Découverte',progress:40,
     description:'Lueur violette rare, aperçue seulement deux fois.',notes:'',
     extra:{couleurLumiere:'Violet',intensite:'Forte',cycle:'Apparition imprévisible',symbolique:'Peut-être liée à une légende du clan'}}),
   d({category:'nocturnes',name:'Fleur de Minuit',rarity:'Rare',location:'Jardin secret Hatori',status:'Étudiée',progress:55,
     description:'Pétales phosphorescents, très recherchée pour l\'alchimie.',notes:'',
     extra:{heureOuverture:'Minuit pile',couleur:'Blanc bleuté',luminosite:'Faible lueur naturelle'}}),
   d({category:'recherches',name:'Ouvrage universel botanique & toxines',status:'En cours',progress:20,
     description:'Recenser toutes les plantes et poisons connus pour en faire un ouvrage de référence.',notes:'Objectif à long terme.',
     extra:{categorieR:'Projet personnel',priorite:'🟡 En cours'}}),
   d({category:'experiences',name:'Expérience n°1',status:'Terminée',progress:100,date:'Jour 1',location:'Laboratoire Hatori',
     description:'',notes:"Conclusion confirmée, développement d'un antidote en cours.",
     extra:{numero:'1',lieuExp:'Laboratoire Hatori',hypothese:'La rosée de Hoshizora ralentit l\'effet du Venin de Kurohana',resultatExp:'Ralentissement confirmé sur échantillon test',conclusion:'Hypothèse validée'}}),
   d({category:'notes',name:'Réflexion du soir',
     description:"Billy et Past sont encore partis en mission sans moi. Ce n'est pas grave, je préfère avancer sur mes recherches.",notes:''}),
  ];
}

function counts(){ const c={}; CATS.forEach(x=>c[x.k]=state.entries.filter(e=>e.category===x.k && !e.secret).length); return c; }

function renderNav(){
  const cnt = counts();
  let html = navItem('accueil','🏯','Accueil');
  CATS.forEach(c=>html+=navItem(c.k,c.i,c.n,cnt[c.k]));
  html += navItem('recherche','🔎','Recherche globale');
  html += navItem('nouveautes','🆕','Derniers ajouts');
  html += navItem('favoris','⭐','Favoris');
  html += navItem('dashboard','📊','Tableau de bord');
  html += `<div class="navitem secret ${current==='secret'?'active':''}" onclick="goto('secret')">🔐 Archives interdites</div>`;
  document.getElementById('nav').innerHTML = html;
}
function navItem(k,i,n,c){ return `<div class="navitem ${current===k?'active':''}" onclick="goto('${k}')">${i} ${n}${c!=null?`<span class="navcount">${c}</span>`:''}</div>`; }
function goto(k){ current=k; statusFilter=''; document.getElementById('search').value=''; document.getElementById('sidebar').classList.remove('open'); render(); }

function render(){
  renderNav();
  const v = document.getElementById('view');
  if(current==='accueil') return renderHome(v);
  if(current==='dashboard') return renderDashboard(v);
  if(current==='favoris') return renderList(v,'Favoris','⭐', state.entries.filter(e=>e.favorite && !e.secret));
  if(current==='recherche') return renderList(v,'Recherche globale','🔎', state.entries.filter(e=>!e.secret));
  if(current==='nouveautes') return renderNouveautes(v);
  if(current==='secret') return renderSecret(v);
  const cat = catByKey(current);
  if(cat) return renderList(v, cat.n, cat.i, state.entries.filter(e=>e.category===cat.k && !e.secret), cat.k);
}

function renderHome(v){
  const cnt = counts();
  v.innerHTML = `
  <div class="hero">
    <div class="sigil">🧪✨🌿</div>
    <h1>HOBORO HATORI</h1>
    <div class="quote">« Les fleurs peuvent donner la vie.<br>Le poison peut la reprendre.<br>La connaissance permet de choisir entre les deux. »</div>
    <div class="sub">ARCHIVES PERSONNELLES — RECHERCHES HATORI</div>
  </div>
  <div class="counters">
    ${counter('🌿','Découvertes',cnt.herbier)}${counter('☠️','Recherches',cnt.poisons)}${counter('🧪','Préparations',cnt.alchimie)}
    ${counter('🩹','Antidotes étudiés',cnt.antidotes)}${counter('🦋','Espèces observées',(cnt.insectes||0)+(cnt.lucioles||0))}${counter('📜','Notes personnelles',cnt.notes)}
  </div>`;
}
function counter(i,l,n){ return `<div class="counter"><div class="n">${i} ${n}</div><div class="l">${l}</div></div>`; }

function renderDashboard(v){
  const cnt = counts();
  const total = state.entries.filter(e=>!e.secret).length;
  const done = state.entries.filter(e=>!e.secret && (e.status==='Terminée'||e.status==='Maîtrisée')).length;
  const wip = state.entries.filter(e=>!e.secret && e.status==='En cours').length;
  const lvl = n=>Math.min(100,(n||0)*100/6);
  v.innerHTML = `<div class="section-title"><h2>📊 Tableau de bord</h2></div>
  <div class="counters">
    ${counter('📦','Découvertes totales',total)}${counter('🟢','Recherches terminées',done)}${counter('🟡','Recherches en cours',wip)}
    ${counter('🌿','Plantes découvertes',cnt.herbier)}${counter('🦋','Insectes observés',cnt.insectes)}${counter('✨','Lucioles découvertes',cnt.lucioles)}
    ${counter('🩹','Antidotes étudiés',cnt.antidotes)}${counter('📜','Expériences réalisées',cnt.experiences)}
  </div>
  <h3 style="color:var(--green);margin-top:24px">Niveau de connaissance de Hoboro</h3>
  ${skillbar('🌿 Botanique',lvl(cnt.herbier))}${skillbar('☠️ Toxicologie RP',lvl(cnt.poisons))}${skillbar('🧪 Alchimie RP',lvl(cnt.alchimie))}
  ${skillbar('🦋 Entomologie',lvl(cnt.insectes))}${skillbar('✨ Étude des lucioles',lvl(cnt.lucioles))}`;
}
function skillbar(l,p){ return `<div style="margin:10px 0"><div style="font-size:.85em;color:var(--text-dim);margin-bottom:4px">${l}</div><div class="progress-bar"><div style="width:${p}%"></div></div></div>`; }

function renderList(v,title,icon,items,catKey){
  const statuses = [...new Set(items.map(i=>i.status).filter(Boolean))];
  let extraBlock = '';
  if(catKey==='lucioles') extraBlock = renderConstellation(items);
  v.innerHTML = `<div class="section-title"><div><h2>${icon} ${title}</h2><p>${items.length} entrée(s)</p></div></div>
  ${extraBlock}
  <div class="filters">${statuses.length?`<select onchange="filterStatus(this.value)"><option value="">Tous statuts</option>${statuses.map(s=>`<option ${statusFilter===s?'selected':''}>${esc(s)}</option>`).join('')}</select>`:''}</div>
  <div class="grid" id="grid"></div>`;
  drawGrid(items);
}
function filterStatus(s){ statusFilter=s; render(); }
function drawGrid(items){
  const grid = document.getElementById('grid');
  const filtered = statusFilter ? items.filter(i=>i.status===statusFilter) : items;
  if(!filtered.length){ grid.innerHTML = `<div class="empty">Aucune entrée pour l'instant. Utilisez « ＋ Nouvelle entrée » pour commencer.</div>`; return; }
  grid.innerHTML = filtered.map(cardHtml).join('');
}
function cardHtml(e){
  const cat = catByKey(e.category);
  return `<div class="card" onclick="openDetail('${e.id}')">
    <span class="star ${e.favorite?'on':''}" onclick="event.stopPropagation();toggleFav('${e.id}')">★</span>
    <h3>${cat?cat.i+' ':''}${esc(e.name)}</h3>
    ${e.location?`<div class="meta">📍 ${esc(e.location)}</div>`:''}
    ${e.rarity?`<span class="badge gold">${esc(e.rarity)}</span>`:''}
    ${e.status?`<span class="badge">${esc(e.status)}</span>`:''}
    ${e.description?`<div class="desc">${esc(e.description)}</div>`:''}
    ${e.progress?`<div class="progress-bar"><div style="width:${e.progress}%"></div></div>`:''}
  </div>`;
}
function toggleFav(id){ const e=state.entries.find(x=>x.id===id); e.favorite=!e.favorite; save(); render(); }

function formatAdded(iso){
  if(!iso) return 'Archives d\'origine';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}) + ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function renderNouveautes(v){
  const items = state.entries.filter(e=>!e.secret).slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  v.innerHTML = `<div class="section-title"><div><h2>🆕 Derniers ajouts</h2><p>Historique des entrées, de la plus récente à la plus ancienne</p></div></div>
  <div class="grid" id="grid"></div>`;
  const grid = document.getElementById('grid');
  if(!items.length){ grid.innerHTML = `<div class="empty">Aucune entrée pour l'instant.</div>`; return; }
  grid.innerHTML = items.map(e=>{
    const cat = catByKey(e.category);
    return `<div class="card" onclick="openDetail('${e.id}')">
      <span class="star ${e.favorite?'on':''}" onclick="event.stopPropagation();toggleFav('${e.id}')">★</span>
      <h3>${cat?cat.i+' ':''}${esc(e.name)}</h3>
      <div class="meta">📅 Ajouté le ${formatAdded(e.createdAt)}</div>
      <span class="badge purple">${cat?cat.n:''}</span>
      ${e.description?`<div class="desc">${esc(e.description)}</div>`:''}
    </div>`;
  }).join('');
}
function renderConstellation(items){
  if(!items.length) return '';
  const pts = items.map((e,idx)=>{
    const seedN = [...e.id].reduce((a,c)=>a+c.charCodeAt(0),0);
    const x = 8 + (seedN*37)%84, y = 15 + (seedN*53)%70;
    return `<div class="star-point" style="left:${x}%;top:${y}%;animation-delay:${(idx%5)*.4}s" title="${esc(e.name)}" onclick="openDetail('${e.id}')"></div>`;
  }).join('');
  return `<div id="constellation">${pts}</div>`;
}

document.getElementById('search').addEventListener('input', ev=>{
  const q = ev.target.value.toLowerCase().trim();
  if(!q){ return render(); }
  renderNav();
  const results = state.entries.filter(x=>!x.secret &&
    ((x.name||'')+' '+(x.description||'')+' '+(x.notes||'')+' '+JSON.stringify(x.extra||{})).toLowerCase().includes(q));
  const v = document.getElementById('view');
  v.innerHTML = `<div class="section-title"><h2>🔎 Résultats pour « ${esc(ev.target.value)} »</h2></div><div class="grid" id="grid"></div>`;
  drawGrid(results);
});

function renderSecret(v){
  if(!unlocked){
    v.innerHTML = `<div class="secretview"><div class="lockscreen"><div class="icon">🔒</div>
    <h2>ARCHIVES INTERDITES</h2><p>Recherches que Hoboro considère comme confidentielles.</p>
    <button class="btn purple" onclick="unlocked=true;render()">Déverrouiller</button></div></div>`;
    return;
  }
  const items = state.entries.filter(e=>e.secret);
  v.innerHTML = `<div class="secretview"><div class="section-title"><h2>🔐 ARCHIVES INTERDITES</h2>
  <button class="btn ghost" onclick="unlocked=false;render()">Refermer</button></div>
  <div class="grid" id="grid"></div></div>`;
  drawGrid(items);
}

// ---- form rendering (add / edit) ----
function fieldHtml(f, val){
  val = val==null?'':val;
  if(f.link){
    const options = state.entries.filter(x=>x.category===f.link).map(p=>`<option value="${p.id}" ${val===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
    return `<div class="field"><label>${f.l}</label><select id="x_${f.k}"><option value="">—</option>${options}</select></div>`;
  }
  if(f.sel) return `<div class="field"><label>${f.l}</label><select id="x_${f.k}">${f.sel.map(s=>`<option ${val===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`;
  if(f.ta) return `<div class="field"><label>${f.l}</label><textarea id="x_${f.k}">${esc(val)}</textarea></div>`;
  return `<div class="field"><label>${f.l}</label><input id="x_${f.k}" value="${esc(val)}"></div>`;
}
function formHtml(cat, e){
  e = e || {};
  const ex = e.extra || {};
  return `
   <div class="field"><label>Nom</label><input id="f_name" value="${esc(e.name)}"></div>
   <div class="field"><label>Rareté</label><input id="f_rarity" value="${esc(e.rarity)}" placeholder="Commune, Rare, Légendaire..."></div>
   <div class="field"><label>Lieu de découverte</label><input id="f_loc" value="${esc(e.location)}"></div>
   <div class="field"><label>Statut</label><select id="f_status">
     ${['','À commencer','En cours','Terminée','Découverte','Étudiée','Maîtrisée','À approfondir'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}
   </select></div>
   <div class="field"><label>Progression (%)</label><input id="f_prog" type="number" min="0" max="100" value="${e.progress||0}"></div>
   <div class="field"><label>Date</label><input id="f_date" value="${esc(e.date)}" placeholder="ex: Jour 12"></div>
   ${cat.extra.map(f=>fieldHtml(f, ex[f.k])).join('')}
   <div class="field"><label>Description RP</label><textarea id="f_desc">${esc(e.description)}</textarea></div>
   <div class="field"><label>Notes de Hoboro</label><textarea id="f_notes">${esc(e.notes)}</textarea></div>
   <div class="field"><label><input type="checkbox" id="f_secret" style="width:auto" ${e.secret?'checked':''}> Archive confidentielle</label></div>`;
}
function openAdd(){
  const opts = CATS.map(c=>`<option value="${c.k}" ${current===c.k?'selected':''}>${c.i} ${c.n}</option>`).join('');
  document.getElementById('modalBody').innerHTML = `
    <h3>＋ Nouvelle entrée</h3>
    <div class="field"><label>Catégorie</label><select id="f_cat" onchange="switchCatForm()">${opts}</select></div>
    <div id="dynform"></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveNew()">Enregistrer</button></div>`;
  switchCatForm();
  showModal();
}
function switchCatForm(){
  const k = document.getElementById('f_cat').value;
  document.getElementById('dynform').innerHTML = formHtml(catByKey(k));
}
function collectForm(cat){
  const g = id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const extra = {}; cat.extra.forEach(f=>extra[f.k]=g('x_'+f.k));
  return {name:g('f_name')||'Sans nom', rarity:g('f_rarity'), location:g('f_loc'), status:g('f_status'),
    progress:Number(g('f_prog'))||0, date:g('f_date'), description:g('f_desc'), notes:g('f_notes'),
    secret:document.getElementById('f_secret').checked, extra};
}
function saveNew(){
  const catKey = document.getElementById('f_cat').value;
  const cat = catByKey(catKey);
  const data = collectForm(cat);
  const e = {id:uid(), favorite:false, category:catKey, createdAt:new Date().toISOString(), ...data};
  state.entries.push(e); save(); closeModal();
  current = e.secret ? 'secret' : e.category; render();
}
function openEdit(id){
  const e = state.entries.find(x=>x.id===id);
  const cat = catByKey(e.category);
  document.getElementById('modalBody').innerHTML = `
    <h3>${cat.i} Modifier — ${esc(e.name)}</h3>
    <div id="dynform">${formHtml(cat, e)}</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="openDetail('${e.id}')">Annuler</button>
      <button class="btn" onclick="saveEdit('${e.id}')">Enregistrer les modifications</button>
    </div>`;
  showModal();
}
function saveEdit(id){
  const e = state.entries.find(x=>x.id===id);
  const cat = catByKey(e.category);
  Object.assign(e, collectForm(cat));
  save(); closeModal(); current = e.secret?'secret':e.category; render();
}
function openDetail(id){
  const e = state.entries.find(x=>x.id===id);
  const cat = catByKey(e.category);
  let extraKv = (cat.extra||[]).map(f=>{
    let v = (e.extra||{})[f.k];
    if(!v) return '';
    if(f.link){
      const target = state.entries.find(x=>x.id===v);
      if(!target) return '';
      return `<div class="linkrow" onclick="openDetail('${target.id}')">🔗 ${f.l} : <b style="color:var(--green)">${esc(target.name)}</b></div>`;
    }
    return `<div class="kv"><b>${f.l}</b><span>${esc(v)}</span></div>`;
  }).join('');
  document.getElementById('modalBody').innerHTML = `
    <h3>${cat.i} ${esc(e.name)}</h3>
    ${e.rarity?`<span class="badge gold">${esc(e.rarity)}</span>`:''} ${e.status?`<span class="badge">${esc(e.status)}</span>`:''}
    ${e.location?`<div class="kv"><b>Lieu</b><span>${esc(e.location)}</span></div>`:''}
    ${e.date&&e.date!=='—'?`<div class="kv"><b>Date</b><span>${esc(e.date)}</span></div>`:''}
    ${e.progress?`<div class="progress-bar"><div style="width:${e.progress}%"></div></div>`:''}
    ${extraKv}
    ${e.description?`<p style="margin-top:10px">${esc(e.description)}</p>`:''}
    ${e.notes?`<p style="color:var(--text-dim);font-style:italic">« ${esc(e.notes)} »</p>`:''}
    <div class="modal-actions">
      <button class="btn danger" onclick="deleteEntry('${e.id}')">🗑️ Archiver</button>
      <button class="btn ghost" onclick="openEdit('${e.id}')">✏️ Modifier</button>
      <button class="btn" onclick="closeModal()">Fermer</button>
    </div>`;
  showModal();
}
function deleteEntry(id){ state.entries = state.entries.filter(x=>x.id!==id); save(); closeModal(); render(); }
function showModal(){ document.getElementById('modalBg').classList.add('show'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', ev=>{ if(ev.target.id==='modalBg') closeModal(); });

(function(){
  const box = document.getElementById('fireflies');
  for(let i=0;i<14;i++){
    const f = document.createElement('div');
    f.className = 'firefly' + (i%3===0?' p':'');
    f.style.left = Math.random()*100+'%'; f.style.top = Math.random()*100+'%';
    f.style.animationDuration = (8+Math.random()*10)+'s, '+(2+Math.random()*3)+'s';
    box.appendChild(f);
  }
})();
render();
</script>
</body>
